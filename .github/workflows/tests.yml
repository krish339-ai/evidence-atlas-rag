name: Local pipeline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_ATLAS_MODE: demo
      VECTOR_BACKEND: memory
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/download_papers.py --sample cms-ma
      - run: python -m pytest -q
      - run: node --test tests/test_export.cjs
      - run: python -m scripts.evaluate_healthcare
      - run: python scripts/check_publication.py
